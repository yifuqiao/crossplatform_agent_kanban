<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agent Kanban</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="bar">
    <h1>Agent Kanban</h1>
    <input id="search" type="search" placeholder="Search tasks…" aria-label="Search tasks">
    <div id="sources" class="chips" role="group" aria-label="Filter by source"></div>
    <label class="toggle"><input id="flat" type="checkbox"> Sub-tasks as cards</label>
    <label class="toggle" title="Superseded tasks, and queued/running tasks with no update for 24h"><input id="stale" type="checkbox"> Show stale (<span id="stale-count">0</span>)</label>
    <button id="ask-grok" class="chip" hidden title="Ask Grok Bot via the task relay to report what really happened"></button>
    <span id="conn" class="conn" title="Live updates">●</span>
  </header>
  <main id="board" class="board"></main>
  <aside id="drawer" class="drawer" hidden>
    <button id="close" class="close" aria-label="Close">×</button>
    <div id="detail"></div>
  </aside>
  <script src="app.js" type="module"></script>
</body>
</html>
